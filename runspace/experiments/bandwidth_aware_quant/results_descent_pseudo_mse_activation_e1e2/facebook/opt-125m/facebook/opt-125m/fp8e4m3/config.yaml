adapter:
  build_quantized: true
  fold_input_norm: false
  fold_layers: false
  input_quantization: true
  quantize_first_layer: false
  quantized_ops:
  - all
  type: slm
  weight_quantization: true
dataset:
  batch_size: 1
  max_blocks: 4
  name: wikitext2_lm
  num_workers: 0
  path: /data/imagenet/val
  seq_len: 128
evaluation:
  compare_batches: 50
  compare_mode: propagated
  dynamic_input_quant:
    activation_exponents: e1e2
    candidate_formats:
    - fp7_e1m5
    - fp7_e2m4
    chunk_size: 128
    collect_error_stats: false
    collect_format_stats: false
    enabled: true
    input_format_policy: typed
    input_transfer_map:
      lm_head: true
      model.decoder.layers.0.fc1: true
      model.decoder.layers.0.fc2: true
      model.decoder.layers.0.self_attn.k_proj: true
      model.decoder.layers.0.self_attn.out_proj: true
